# OpenSSD age 임계값 실험 수행 방법 (Ubuntu workload + SDK 노트북 UART 수집)
#
# 1) 펌웨어 빌드·보드 프로그램은 SDK 노트북에서 미리 완료합니다.
# 2) OpenSSD의 JTAG/UART는 SDK 노트북에 연결하고, PCIe는 Ubuntu 데스크탑에 연결합니다.
# 3) Ubuntu에서 아래처럼 실행합니다:
#      sudo bash ./run_experiment.sh ./experiment.conf
#    Ubuntu가 각 workload를 실행한 뒤 멈춥니다. 노트북의 SDK UART Terminal을 닫고
#    collect.exe로 메타데이터를 수집한 다음 CSV를 Ubuntu에서 접근 가능한 위치로 복사합니다.
#    Ubuntu 스크립트에 CSV 경로를 입력하면 그래프 생성이 이어집니다.
#  결과는 RUNS_ROOT 아래 workload별 폴더에 저장됩니다. 재실행하거나 임계값을
# 바꿀 때는 RUNS_ROOT를 새 이름으로 지정하세요.

# -------------파라미터-------------------
# age 임계값입니다. GC의 age가 이 값보다 크면 cold, 같거나 작으면 hot으로
# 분류합니다. 펌웨어 address_translation.h의 GC_AGE_THRESHOLD와 같은 값이어야 합니다.
# 임계값을 바꾼 실험은 RUNS_ROOT도 다르게 지정해 결과가 섞이지 않게 하세요.
AGE_THRESHOLD=1000


# fio가 접근할 실험 대상입니다. Ubuntu에서 확인한 실제 OpenSSD 장치 경로를 지정합니다.
# 예: /dev/nvme0n1 또는 /dev/nvme1n1.
# 쓰기 실험은 지정한 장치의 데이터를 덮어쓸 수 있으니 대상 장치를 확인하세요.
TARGET_PATH=/dev/nvme1n1

# 한 번에 읽거나 쓸 I/O 크기입니다. 예: 4k, 16k, 128k.
# 장치의 논리/물리 페이지 크기와 실험 목적에 맞춰 조절하세요.
IO_SIZE=4k

# workload가 사용할 데이터 범위입니다. 예: 1G, 10G.
# 장치 용량을 넘지 않도록 설정하고, 전체 장치 실험이면 실제 용량을 확인하세요.
WORKING_SET_SIZE=1G

# 최대 workload 수행 시간(초)제한 입니다. 예: 60은 1분, 300은 5분.
RUNTIME_SECONDS=300

# 직접 I/O 사용 여부입니다. 1은 OS 캐시를 우회하고, 0은 OS 캐시를 사용할 수 있습니다.
# SSD 동작을 측정하는 실험에서는 보통 1로 둡니다.
DIRECT_IO=1

# 동시에 대기시킬 I/O 요청 수입니다. 높이면 병렬성이 커집니다.
# 예: 1은 낮은 병렬성, 32는 더 높은 병렬성입니다.
IO_DEPTH=32

# fio 작업 프로세스 수입니다. 1은 단일 작업, 2 이상은 여러 작업을 병렬 실행합니다.
NUM_JOBS=1

# SDK 노트북에서 OpenSSD UART에 연결된 포트입니다. Windows 장치 관리자에서 확인하세요.
UART_PORT=COM4

# UART 통신 속도(baud)입니다. 펌웨어와 동일해야 합니다. 기본 예: 115200.
UART_BAUD=115200

# SDK 노트북에 있는 메타데이터 수집 프로그램입니다. Ubuntu 스크립트가 직접 실행하지는 않습니다.
COLLECT_EXE=collect.exe

# 네 workload 결과의 상위 폴더입니다. 설정 파일 기준 experiment/results에 저장됩니다.
# 각 workload마다 하위 결과 폴더가 자동 생성됩니다.
# 같은 이름의 결과 폴더가 이미 있으면 덮어쓰지 않고 스크립트가 중단됩니다.
RUNS_ROOT=results
