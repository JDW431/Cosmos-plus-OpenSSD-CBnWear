# OpenSSD age 임계값 실험 수행 방법
#
# 실행 : ./run_experiment.sh ./experiment.conf
#  순차 쓰기 → 순차 읽기 → 임의 쓰기 → 임의 읽기가 자동 수행됩니다.
#    각 workload 후 메타데이터 CSV 수집과 그래프 생성도 이어서 진행됩니다.
#  결과는 RUNS_ROOT 아래 workload별 폴더에 저장됩니다. 재실행하거나 임계값을
#    바꿔 실험할 때는 RUNS_ROOT를 새 이름으로 설정합니다.

# -------------파라미터-------------------
# age 임계값입니다. GC의 age가 이 값보다 크면 cold, 같거나 작으면 hot으로
# 분류합니다. 그래프 분석과 펌웨어 할당 정책이 같은 기준을 쓰도록
# address_translation.h의 GC_AGE_THRESHOLD와 반드시 같은 값으로 설정하세요.
# 임계값을 바꾼 실험은 RUNS_ROOT도 다르게 지정해 결과가 섞이지 않게 하세요.
AGE_THRESHOLD=1000


# fio가 접근할 실험 대상입니다. 실제 OpenSSD 장치 경로로 바꿔야 합니다.
# 예: Linux /dev/nvme0n1, Windows 환경에서는 해당 fio 장치 이름 사용.
# 쓰기 실험은 지정한 장치의 데이터를 덮어쓸 수 있으니 대상 장치를 확인하세요.
TARGET_PATH=/dev/nvme0n1

# 한 번에 읽거나 쓸 I/O 크기입니다. 예: 4k, 16k, 128k.
# 장치의 논리/물리 페이지 크기와 실험 목적에 맞춰 조절하세요.
IO_SIZE=4k

# workload가 사용할 데이터 범위입니다. 예: 1G, 10G.
# 장치 용량을 넘지 않도록 설정하고, 전체 장치 실험이면 실제 용량을 확인하세요.
WORKING_SET_SIZE=1G

# 최대 workload 수행 시간(초)제한 입니다. 예: 60은 1분, 300은 5분.
RUNTIME_SECONDS=300

# 직접 I/O 사용 여부입니다. 1은 OS 캐시를 우회하고, 0은 OS 캐시를 사용할 수 있습니다.
# SSD 동작을 측정하는 실험에서는 보통 1로 둡니다.
DIRECT_IO=1

# 동시에 대기시킬 I/O 요청 수입니다. 높이면 병렬성이 커집니다.
# 예: 1은 낮은 병렬성, 32는 더 높은 병렬성입니다.
IO_DEPTH=32

# fio 작업 프로세스 수입니다. 1은 단일 작업, 2 이상은 여러 작업을 병렬 실행합니다.
NUM_JOBS=1

# 메타데이터팀에서 제공한 UART 수집 프로그램 경로입니다.
# Windows Git Bash 예: ./collect.exe. 실행 가능한 경로를 지정하세요.
COLLECT_EXE=./collect.exe

# SSD가 연결된 UART 포트입니다. 예: COM4 또는 시스템의 해당 serial 장치.
UART_PORT=COM4

# UART 통신 속도(baud)입니다. 펌웨어와 동일해야 합니다. 기본 예: 115200.
UART_BAUD=115200

# 네 workload 결과의 상위 폴더입니다. 설정 파일 기준 experiment/results에 저장됩니다.
# 각 workload마다 하위 결과 폴더가 자동 생성됩니다.
# 같은 이름의 결과 폴더가 이미 있으면 덮어쓰지 않고 스크립트가 중단됩니다.
RUNS_ROOT=results
